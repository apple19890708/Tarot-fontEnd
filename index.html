<!doctype html>
<!-- 手機（sm 以下）基準字級 14px：Tailwind 的字級與間距都是 rem，整體一起縮小 -->
<html lang="zh-Hant" class="text-[14px] sm:text-[16px]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iPhone 要「加入主畫面」後才能收到瀏覽器推播，需要 manifest（display: standalone） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1526" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orange_Tarot</title>
    <!-- 日夜模式：畫面出來前先套好，避免白天模式先閃一下黑夜（和 src/lib/theme.ts 同一個 key） -->
    <script>
      try {
        if (localStorage.getItem('tarot.theme') === 'day') document.documentElement.dataset.theme = 'day'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
