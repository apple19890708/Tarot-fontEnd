name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 這個 repo 的根目錄就是前端專案，沒有 frontend/ 子資料夾，
# 所以不設 working-directory（原本設了，每次都在 npm ci 之前就失敗）。
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 規則檢查要和推送前的版本比對，需要完整歷史
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 需要 Node 20.19+ 或 22.12+
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 專案規則（ui-check／verify 能機械判斷的部分），只看這次推送或 PR 改動的行
      - name: Check project rules
        run: node scripts/check-rules.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      # build 會先跑 vue-tsc，型別錯誤會在這裡擋下來
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present

# 2026-11-20 移除兩個步驟（同後端 a286282 的改法）：
# - Deploy to Render：步驟的 if 不能讀 secrets，整個 workflow 檔被判無效，每次推送都在開始前就失敗；
#   前端也早就改部署到 GitHub Pages（deploy-pages.yml），不再用 Render。
# - Create Release：每次推送都開一個 Release，沒有人用；部署由 deploy-pages.yml 負責。
