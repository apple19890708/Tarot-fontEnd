name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 這個 repo 的根目錄就是前端專案，沒有 frontend/ 子資料夾，
# 所以不設 working-directory（原本設了，每次都在 npm ci 之前就失敗）。
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 需要 Node 20.19+ 或 22.12+
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # build 會先跑 vue-tsc，型別錯誤會在這裡擋下來
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present

      - name: Create Release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: Frontend Release ${{ github.run_number }}
          files: dist/**
          draft: false
          prerelease: false

      - name: Deploy to Render
        if: ${{ github.ref == 'refs/heads/main' && secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}
        run: |
          curl -sS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -d '{}'
